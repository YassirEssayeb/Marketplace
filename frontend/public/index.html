    <title>ProMarket</title>
    <style>
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        vertical-align: middle;
      }
      .premium-card-hover {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .premium-card-hover:hover {
        box-shadow: 0px 4px 12px rgba(15, 23, 42, 0.08);
        transform: translateY(-2px);
      }
      .glass-effect {
        background: rgba(255, 255, 255, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }
      .form-input-focus:focus {
        border-color: #0051d5;
        box-shadow: 0 0 0 2px rgba(0, 81, 213, 0.1);
      }
      .chat-scroll::-webkit-scrollbar { width: 6px; }
      .chat-scroll::-webkit-scrollbar-track { background: transparent; }
      .chat-scroll::-webkit-scrollbar-thumb { background: #c6c6cd; border-radius: 3px; }
      .chat-scroll::-webkit-scrollbar-thumb:hover { background: #76777d; }
    </style>

  <body class="bg-background text-on-background font-body-md selection:bg-secondary-fixed selection:text-on-secondary-fixed">
